<!doctype html><html><head><meta charset="utf-8">
<!--
  Blog covers. Rendered by render-cover.mjs. 1600x840.

  Site covers (approved 13.10.2026, see style-guide.md section 11). Light warm
  background, so the cover stands out against the dark site. One idea from the
  post, readable as a 230px thumbnail. One gold element marks what is held.
    cards    open tasks on scattered cards, one held in gold. items, held
    columns  comparison cards, the last one is ours.         cols[{t,rows[[label,1|.5|0]]}]
    line     one short line from the post, large.            line, sub
    loops    a field of unfinished rings, one closed.         (no content)
    threads  options start together, all but one stop.        names[4], last is ours

  Crops: the blog list shows 16:10 (about 128px off each side), the post hero
  16:7 (70px off top and bottom). Keep what matters inside x 150 to 1450,
  y 90 to 750.

  LinkedIn image: C, the title is the image (approved 11.10.2026).
  A and B are the first site covers, kept for reference only: dark on a dark
  site, they disappeared in the list (replaced 13.10.2026).
  Shapes are seeded from the slug: same post, same cover.
-->
<style>
@font-face{font-family:Heebo;src:url(../../public/fonts/heebo-hebrew-var-v5.woff2);font-weight:100 900;unicode-range:U+0590-05FF,U+200C-2010,U+FB1D-FB4F}
@font-face{font-family:Heebo;src:url(../../public/fonts/heebo-latin-var-v5.woff2);font-weight:100 900}
@font-face{font-family:Mono;src:url(../../public/fonts/jetbrains-mono-latin-var-v5.woff2);font-weight:100 800}
:root{--ink:#0B1B33;--ink2:#2A3A55;--ivory:#F4EDE1;--sand:#E7DBC6;--gold:#B08D57;--goldd:#8C6B3B}
html,body{margin:0;background:#0B1B33}
#c{position:relative;width:1600px;height:840px;overflow:hidden;font-family:Heebo}
#c.dark{background:radial-gradient(1200px 700px at 78% 40%,#12284A 0%,#0B1B33 55%,#08182D 100%)}
#c.light{background:radial-gradient(1000px 640px at 50% 48%,#FBF7F0 0%,var(--ivory) 58%,var(--sand) 100%)}
svg{position:absolute;inset:0}
.mono{position:absolute;font-family:Mono;font-size:15px;letter-spacing:.18em;color:#A9B8C9;text-transform:uppercase}
.title{position:absolute;font-family:Heebo;font-weight:200;color:#F8F4EC;letter-spacing:-.02em;line-height:1.18}
.gold{color:#B08D57}
.card{position:absolute;background:#fff;border-radius:14px;box-shadow:0 1px 0 rgba(11,27,51,.06),0 18px 40px -18px rgba(11,27,51,.35);padding:22px 26px;box-sizing:border-box;display:flex;align-items:center;gap:18px;color:var(--ink);font-size:27px;font-weight:400;white-space:nowrap}
.dot{flex:none;width:22px;height:22px;border-radius:50%;border:2.5px solid rgba(11,27,51,.35)}
.card .meta{font-family:Mono;font-size:14px;letter-spacing:.12em;color:#8A93A3;margin-inline-start:auto;padding-inline-start:24px}
.card.held{border:2px solid var(--gold)}
.card.held .dot{border-color:var(--gold);background:var(--gold)}
.col{position:absolute;top:220px;width:300px;height:400px;background:#fff;border-radius:16px;box-shadow:0 18px 40px -18px rgba(11,27,51,.35);box-sizing:border-box;padding:34px 30px;color:var(--ink)}
.col h3{margin:0 0 34px;font-weight:500;font-size:33px;line-height:1.15;height:80px}
.row{display:flex;align-items:center;gap:14px;font-size:26px;margin:0 0 24px;color:var(--ink2)}
.row i{flex:none;width:22px;height:22px;border-radius:50%}
.row i.y{background:var(--ink)} .row i.n{border:2px solid rgba(11,27,51,.25)} .row i.h{border:2px solid var(--ink);background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}
.col.held{background:var(--ink);color:#F8F4EC;outline:2px solid var(--gold);outline-offset:-2px}
.col.held .row{color:#E9E1D2} .col.held .row i.y{background:var(--gold)} .col.held h3{color:#F8F4EC}
.big{position:absolute;color:var(--ink);font-weight:300;letter-spacing:-.03em;line-height:1.02}
</style></head><body><div id="c"></div>
<script>
const P=JSON.parse(decodeURIComponent(location.search.slice(3)));
function rng(s){let h=2166136261;for(const ch of s)h=Math.imul(h^ch.charCodeAt(0),16777619);return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return((h>>>0)%100000)/100000}}
const r=rng(P.seed||'x'),W=1600,H=840,c=document.getElementById('c');
const ns='http://www.w3.org/2000/svg';const svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.setAttribute('width',W);svg.setAttribute('height',H);c.appendChild(svg);
function el(t,a){const e=document.createElementNS(ns,t);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e}
function div(cls,css,html){const d=document.createElement('div');d.className=cls;d.style.cssText=css;if(html!=null)d.innerHTML=html;c.appendChild(d);return d}
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]));
const rtl=P.locale==='he',side=rtl?'right':'left';
const mx=x=>rtl?W-x:x;
c.style.direction=rtl?'rtl':'ltr';
const LIGHT=['cards','columns','line','loops','threads'];
c.className=LIGHT.includes(P.concept)?'light':'dark';

if(P.concept==='cards'){
 // Open tasks, scattered and overlapping. One is held, in gold. Up to 11 items: [text, meta].
 const pos=[[200,120,-3],[690,90,2],[1030,170,-2],[150,300,2],[560,250,-1.5],[980,340,3],[260,470,-2],[700,430,1.5],[1060,520,-3],[380,620,2.5],[820,630,-1]];
 P.items.slice(0,11).forEach((t,i)=>{const p=pos[i],held=i===P.held;
  div('card'+(held?' held':''),side+':'+(p[0]+r()*40)+'px;top:'+(p[1]+r()*20)+'px;transform:rotate('+(rtl?-p[2]:p[2])+'deg);opacity:'+(held?1:0.82+r()*0.18)+';z-index:'+(held?9:1),
   '<span class="dot"></span><span>'+esc(t[0])+'</span><span class="meta">'+esc(t[1]||'')+'</span>');});
}
if(P.concept==='columns'){
 // A comparison as cards. The last card is ours, dark with gold. 1 = yes, .5 = partly, 0 = no.
 const cols=P.cols.slice(0,4),gap=36,w=300,total=cols.length*w+(cols.length-1)*gap,x0=(W-total)/2;
 cols.forEach((col,i)=>div('col'+(i===cols.length-1?' held':''),side+':'+(x0+i*(w+gap))+'px',
  '<h3>'+esc(col.t)+'</h3>'+col.rows.map(([k,v])=>'<div class="row"><i class="'+(v===1?'y':v===.5?'h':'n')+'"></i>'+esc(k)+'</div>').join('')));
}
if(P.concept==='line'){
 // One short line from the post, not the title. 2 to 6 words; "|" breaks the line.
 el('line',{x1:mx(150),y1:560,x2:mx(330),y2:560,stroke:'#B08D57','stroke-width':3});
 div('big',side+':150px;top:190px;width:1300px;font-size:150px',String(P.line).split('|').map(esc).join('<br>'));
 div('','position:absolute;'+side+':150px;top:600px;font-size:36px;font-weight:300;color:var(--ink2);width:1100px',esc(P.sub));
 div('mono',side+':150px;top:110px;color:#7C8696','ANKORA <span class="gold">/</span> '+esc(P.category));
}
if(P.concept==='loops'){
 // Open loops: a field of unfinished rings. One ring is closed, in gold.
 const cols=13,rows=6,sx=1180/(cols-1),sy=460/(rows-1),x0=210,y0=190,held=[rtl?3:9,2];
 for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const x=x0+i*sx,y=y0+j*sy,rr=20+r()*10;
  if(i===held[0]&&j===held[1]){el('circle',{cx:x,cy:y,r:62,fill:'rgba(176,141,87,.12)'});el('circle',{cx:x,cy:y,r:34,fill:'none',stroke:'#B08D57','stroke-width':7});el('circle',{cx:x,cy:y,r:11,fill:'#B08D57'});continue}
  const open=0.18+r()*0.55,a0=r()*360,len=(1-open)*2*Math.PI*rr;
  el('circle',{cx:x,cy:y,r:rr,fill:'none',stroke:'rgba(11,27,51,'+(0.35+r()*0.4)+')','stroke-width':3,'stroke-linecap':'round','stroke-dasharray':len+' 9999',transform:'rotate('+a0+' '+x+' '+y+')'});}
}
if(P.concept==='threads'){
 // Four options start together. Three stop at different points; the last runs through, in gold.
 const ys=[250,370,490,610],stops=[0.38,0.55,0.72,1],xa=mx(180),L=mx(W-180)-xa;
 ys.forEach((y,i)=>{const last=i===3,xe=xa+L*stops[i];
  el('circle',{cx:xa,cy:y,r:9,fill:last?'#B08D57':'#0B1B33'});
  el('line',{x1:xa,y1:y,x2:xe,y2:y,stroke:last?'#B08D57':'#0B1B33','stroke-width':last?9:6,'stroke-linecap':'round'});
  if(!last){el('line',{x1:xe,y1:y,x2:xe+(rtl?-1:1)*140,y2:y,stroke:'rgba(11,27,51,.28)','stroke-width':4,'stroke-dasharray':'2 16','stroke-linecap':'round'});
   el('line',{x1:xe,y1:y-22,x2:xe,y2:y+22,stroke:'#0B1B33','stroke-width':4,'stroke-linecap':'round'});}
  else{el('circle',{cx:xe,cy:y,r:14,fill:'#B08D57'});el('circle',{cx:xe,cy:y,r:34,fill:'none',stroke:'rgba(176,141,87,.4)','stroke-width':2});}
  div('','position:absolute;'+side+':180px;top:'+(y-66)+'px;font-size:32px;font-weight:'+(last?500:400)+';color:'+(last?'#8C6B3B':'#2A3A55'),esc(P.names[i]));
 });
}
if(P.concept==='A'){
 // Reference only. Complexity converging into one clear line.
 const fx=mx(1040),fy=420,n=38;
 for(let i=0;i<n;i++){const sy=190+r()*560,sx=mx(60+r()*260),c1=mx(420+r()*260),c2=mx(760+r()*140);
  el('path',{d:'M'+sx+' '+sy+' C '+c1+' '+(sy+(r()-.5)*260)+', '+c2+' '+(fy+(r()-.5)*60)+', '+fx+' '+fy,fill:'none',stroke:'rgba(248,244,236,'+(0.06+r()*0.16)+')','stroke-width':0.8+r()*0.8});
  el('circle',{cx:sx,cy:sy,r:1.6+r()*1.6,fill:'rgba(169,184,201,.55)'});}
 el('line',{x1:fx,y1:fy,x2:mx(1540),y2:fy,stroke:'#B08D57','stroke-width':2.2});
 el('circle',{cx:fx,cy:fy,r:7,fill:'#B08D57'});el('circle',{cx:fx,cy:fy,r:22,fill:'none',stroke:'rgba(176,141,87,.45)'});
 el('circle',{cx:fx,cy:fy,r:46,fill:'none',stroke:'rgba(176,141,87,.18)'});
}
if(P.concept==='B'){
 // Reference only. A dot grid where one seeded region is resolved into gold structure.
 const step=40,cx0=rtl?380:1220,cy0=420;const lit=[];
 for(let x=20;x<W;x+=step)for(let y=20;y<H;y+=step){const d=Math.hypot(x-cx0,y-cy0);const inR=d<210+r()*40&&r()>0.35;
  el('circle',{cx:x,cy:y,r:inR?2.6:1.2,fill:inR?'#B08D57':'rgba(248,244,236,'+(0.08+Math.max(0,0.16-d/5000))+')'});if(inR)lit.push([x,y]);}
 const key=(x,y)=>x+','+y,set=new Set(lit.map(p=>key(p[0],p[1])));
 for(const [x,y] of lit){for(const [dx,dy] of [[step,0],[0,step]]){if(set.has(key(x+dx,y+dy))&&r()>0.45)el('line',{x1:x,y1:y,x2:x+dx,y2:y+dy,stroke:'rgba(176,141,87,.55)','stroke-width':1.2});}}
 div('title',side+':110px;top:300px;width:720px;font-size:56px',esc(P.title));
}
if(P.concept==='C'){
 // LinkedIn: the title is the image. Contour lines as the only ornament.
 const ox=mx(1350),oy=420;
 for(let i=1;i<=14;i++){const rr=40+i*34+r()*8;el('ellipse',{cx:ox,cy:oy,rx:rr*1.15,ry:rr,fill:'none',stroke:i===5?'rgba(176,141,87,.7)':'rgba(248,244,236,'+(0.04+0.05*(i%3===0))+')','stroke-width':i===5?1.6:1,transform:'rotate('+(r()*20-10)+' '+ox+' '+oy+')'});}
 el('line',{x1:mx(110),y1:250,x2:mx(170),y2:250,stroke:'#B08D57','stroke-width':2});
 div('title',side+':110px;top:285px;width:930px;font-size:66px',esc(P.title));
}
if(['A','B','C'].includes(P.concept)) div('mono',side+':110px;top:118px','ANKORA <span class="gold">/</span> '+esc(P.category));
</script></body></html>
