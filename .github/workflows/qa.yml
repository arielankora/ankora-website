# Automated QA.
#
# Three entry points, one runner:
#   - every pull request        -> level 1, blocking. ~4 minutes.
#   - every night at 03:00 UTC  -> level 2 against main, reporting.
#   - Sunday's 03:00 UTC run     -> level 3, the weekly fault hunt.
#   - manual dispatch           -> any level, on demand.
#
# Level 3 runs as parallel shards; levels 1 and 2 run as one job. See
# qa/lib/shards.mjs for the arithmetic and jobs.qa below for the wiring.
#
# Why CI and not only the agent: this repo's own tooling notes record that
# ankora.co.il and binaries.prisma.sh are unreachable from the assistant's
# sandbox and from the device bridge. GitHub's runners have neither
# restriction, so CI is the only place the full suite can actually run -
# and it runs whether or not anyone is at a keyboard.

name: QA

on:
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      level:
        description: "QA level (1 = quick, 2 = deep, 3 = fault hunt)"
        required: false
        default: "2"
        type: choice
        options: ["1", "2", "3"]

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

# Why the runner is pinned, and why the actions jumped several majors.
#
# 19.10.2026: GitHub began moving `ubuntu-latest` to Ubuntu 26.04. It is a
# gradual rollout, so the label can resolve to a different image from one run
# to the next with nothing in this file changing. That image also drops tools
# the old one had (Java 8, a global tsc, webpack); this repo uses none of them
# from the image, but "uses none of them" is a thing to verify once rather
# than discover on a Sunday.
#
# The deciding reason is narrower. This week the suite's timings were measured
# for the first time and the shard plan in qa/lib/shards.mjs is built on those
# numbers. An image that changes underneath invalidates the baseline while it
# is still being used to make decisions. So: pinned, deliberately, with a date
# on it.
#
# REVISIT BY 1.3.2027. A pin is a migration deferred, not avoided, and
# ubuntu-24.04 will be retired in its turn. Moving on purpose, with the
# timings re-measured, is the point.
#
# The actions are on their Node 24 majors. Every run was printing "Node.js 20
# is deprecated ... being forced to run on Node.js 24" for all five of them.
# The versions here were read from the GitHub API rather than guessed, and
# each major's release notes were checked against how this file uses them:
#
#   checkout v7, setup-node v7   runtime only for our usage. setup-node
#                                changed its automatic cache detection in v5
#                                and narrowed it to npm in v6; this file asks
#                                for `cache: npm` explicitly either way.
#   upload-artifact v7           adds an opt-in `archive: false`; default
#                                behaviour unchanged.
#   download-artifact v8         the v5 break was for downloads BY ID; this
#                                file downloads by `pattern`. v8 makes a hash
#                                mismatch an error instead of a warning, which
#                                is the direction this suite wants.
#   github-script v9             `require('@actions/github')` no longer works.
#                                The script below requires only `fs`, a Node
#                                builtin, and uses the injected `github` and
#                                `context`.

jobs:
  # Which level, and in how many pieces.
  #
  # This used to be the first step of the one big job. It is its own job now
  # because a matrix has to know how many jobs to start before any of them
  # begins, and the level is what decides that. It is cheap: a checkout and
  # a few lines of shell.
  level:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      value: ${{ steps.level.outputs.value }}
      shards: ${{ steps.level.outputs.shards }}
      sharded: ${{ steps.level.outputs.sharded }}
    steps:
      # Full history: the level-selection step below diffs against the
      # base branch, which a shallow clone cannot see.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The level: an explicit dispatch input wins; a pull request is
      # level 1 so the gate stays fast; Sunday's nightly run is the weekly
      # fault hunt; anything else is the default deep regression.
      #
      # 26.9.2026: the weekly level 3 used to be a scheduled assistant
      # session that dispatched this workflow by hand. That session runs
      # in the cloud with no bridge to anyone's machine, and GitHub's API
      # is not reachable from there - so the one run of the week that is
      # supposed to look hardest could not start itself, and had not for
      # at least a week. A schedule that depends on something being able
      # to press a button is not a schedule. 03:00 UTC is already 06:00
      # in Israel, which is the hour the weekly hunt was meant to run, so
      # this needs no second cron - only the day.
      #
      # The one exception: a pull request that changes the browser suite
      # itself runs at level 2, because level 1 does not open a browser -
      # so without this, a change to the e2e specs would merge having
      # never once been executed. The suite has to be able to test the
      # thing it is made of.
      # The same holds for qa/checks/vitest.mjs, which decides how the
      # integration suite runs (added 29.9.2026 with the UTC run, #132).
      - name: Choose level
        id: level
        run: |
          if [ -n "${{ inputs.level }}" ]; then
            LEVEL="${{ inputs.level }}"
          elif [ "${{ github.event_name }}" != "pull_request" ]; then
            # %u is 7 on Sunday. The schedule fires at 03:00 UTC, so the
            # day is unambiguous - no run of this branch straddles
            # midnight.
            if [ "$(date -u +%u)" = "7" ]; then
              echo "sunday - running the weekly fault hunt"
              LEVEL=3
            else
              LEVEL=2
            fi
          # 7.10.2026: the diff is taken on its own line first. It used to
          # be piped straight into grep, so when it FAILED (a stacked pull
          # request whose base branch had been merged and deleted: there
          # is no origin/<base> to diff against) grep saw nothing, the
          # condition was false, and the run fell through to level 1 in
          # silence. #155, a fix to client-facing portal code, ran that
          # way once. A gate that cannot tell what changed now assumes the
          # worst and runs level 2.
          elif ! CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" 2>&1); then
            echo "could not diff against origin/${{ github.base_ref }} - running level 2 rather than guessing:"
            echo "$CHANGED"
            LEVEL=2
          elif printf '%s\n' "$CHANGED" \
               | grep -qE '^(qa/(e2e/|playwright\.config\.ts|checks/vitest\.mjs)|tests/integration/|lib/app-domain/|prisma/|app/\(product\)/app/|components/app/)'; then
            # Level 1 runs types, lint and the unit suite. It does not run
            # the integration suite, and it does not open a browser - so a
            # pull request that changes domain logic, or adds an
            # integration test to prove it, was being gated by checks that
            # cannot see either. The tests went green without running.
            #
            # Found by a pull request that batched the hour-bank queries
            # and shipped equivalence tests to prove the batched answer
            # matched the per-client one. Those tests are the entire
            # argument for the change, and level 1 would have skipped
            # every one of them.
            #
            # The product screens were added on 25.9.2026, and by the same
            # reasoning. A pull request that changed only a .tsx under
            # /app was gated by types, lint and the unit suite - none of
            # which opens a browser, and the browser suite is the ONLY
            # thing in this repo that tests a screen. So a fix to the one
            # write a CLIENT makes in this product, on the screen where
            # they approve spending, ran a gate that could not see it.
            #
            # That pull request was the fix for a failure the browser
            # suite had caught twice. It could not be verified by the
            # suite that found it.
            #
            # The cost is honest: a screen change now pays ten minutes on
            # the gate instead of four. A screen nobody watched a browser
            # open is a screen nobody tested.
            echo "touches domain logic, the schema or a suite level 1 cannot run - running level 2"
            LEVEL=2
          else
            LEVEL=1
          fi

          echo "value=$LEVEL" >> "$GITHUB_OUTPUT"

          # How many jobs this level runs as, straight from qa/lib/shards.mjs.
          #
          # The plan lives there and not here so that the matrix and the
          # runner cannot disagree about what exists: a list copied into this
          # file is a list that will drift. `null` back means one job.
          #
          # Level 1 is never split: it is two minutes, and four job setups to
          # save one would be a worse gate, not a faster one. Level 2 is, as
          # of 20.10.2026, because it runs every night and gates most pull
          # requests, it has grown from 11 minutes in late September to 34,
          # and `integration` is almost all of it.
          SHARDS=$(node -e "import('./qa/lib/shards.mjs').then(m => console.log(JSON.stringify(m.shardsFor($LEVEL))))")
          if [ "$SHARDS" = "null" ]; then
            SHARDS='["all"]'
            echo "sharded=false" >> "$GITHUB_OUTPUT"
          else
            echo "sharded=true" >> "$GITHUB_OUTPUT"
          fi
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "level $LEVEL, shards $SHARDS"

  qa:
    needs: level
    runs-on: ubuntu-24.04

    # One job per shard at level 3; a single "all" job at levels 1 and 2.
    #
    # fail-fast is off deliberately. The weekly run exists to find things,
    # and cancelling three healthy shards because a fourth went red would
    # throw away three quarters of the hunt to save a few runner minutes.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.level.outputs.shards) }}
    # 18.10.2026: was 45. The weekly level-3 run cannot finish inside it,
    # and that is measured twice, not inferred: run #299 (11.10) and run
    # #406 (18.10) were both stopped by this wall with "the job has
    # exceeded the maximum execution time of 45m0s". Neither produced a
    # verdict. The last level-3 report is from 4.10.
    #
    # The arithmetic says it could never have finished. Level 3 is level
    # 2 plus three passes, and level 2 alone measures 32.6 min of checks
    # (run #399, 17.10): integration 1266.7s, integration-UTC 244.9s over
    # 12 date-sensitive files, e2e 257.3s, build 54.0s. Level 3 swaps
    # those 12 files for the whole suite (+~1020s) and adds a third full
    # unit+integration pass under V8 coverage (>=1300s) plus the
    # accessibility check: ~73 min of checks against a 45-minute wall.
    #
    # 90 is headroom, not a target. The daily level-2 run has gone from
    # 11 min (late September) to 34 min, so the wall has to sit above
    # where the suite is heading.
    #
    # The real fix is structural and is NOT done here: the three heavy
    # passes (Israel, UTC, coverage) are independent, and run serially
    # against one database. Three parallel jobs with a Postgres each
    # would put level 3 at ~25 min instead of ~73.
    timeout-minutes: 90

    # The default GITHUB_TOKEN is read-only, so the report comment failed on
    # the first real run with "Resource not accessible by integration".
    permissions:
      contents: read
      pull-requests: write
      # 18.10.2026, for the "Scheduled run health" check: it reads this
      # workflow's own past scheduled runs to notice one that never
      # produced a verdict. Without this the API answers "Resource not
      # accessible by integration". Read-only, and only this workflow's
      # runs are of any interest to it.
      actions: read

    # Level 2 and 3 run the integration suite, which needs a real Postgres.
    # A service container is cheaper and far more predictable than the
    # embedded-postgres package used for local development.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ankora
          POSTGRES_PASSWORD: ankora_ci_only
          POSTGRES_DB: ankora_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Pinned for determinism: date-sensitive code should not give a
      # different answer on a UTC runner than on a machine in Israel.
      # (It is NOT what makes the report_schedules waivers behave - those
      # fail on every machine, because computeReportingPeriod hardcodes
      # Asia/Jerusalem in its own signature. An earlier revision of this
      # file claimed otherwise; that claim was wrong.)
      TZ: Asia/Jerusalem
      QA_DATABASE_URL: postgresql://ankora:ankora_ci_only@127.0.0.1:5432/ankora_ci
      DATABASE_URL: postgresql://ankora:ankora_ci_only@127.0.0.1:5432/ankora_ci
      # Prisma Migrate reads this one (schema.prisma `directUrl`). There is
      # no pooler in front of the CI Postgres, so it is the same string -
      # but the variable has to exist or every prisma command here fails
      # before it opens a connection.
      DATABASE_URL_UNPOOLED: postgresql://ankora:ankora_ci_only@127.0.0.1:5432/ankora_ci
      # The canonical host (lib/site.ts, ADR-0002). Pointing this at the
      # apex overrides the code's own default and makes every route 308.
      QA_PROD_URL: https://www.ankora.co.il
      AUTH_SECRET: ci-only-not-a-real-secret
      # Auth.js v5 will not build a redirect for an origin it does not
      # trust, and 127.0.0.1:3100 is not one it infers. Without these, the
      # sign-in POST lands on /api/auth/callback/credentials and simply
      # stops there - which looks exactly like a broken login button, and
      # is really a missing environment variable. Production sets its own
      # host, so this gap only ever showed up here.
      AUTH_URL: http://127.0.0.1:3100
      AUTH_TRUST_HOST: "true"
      ADMIN_PASSWORD: ci-only-not-a-real-password
      ADMIN_SESSION_SECRET: ci-only-not-a-real-secret
      # Credentials vault: the local key-wrapping key (lib/vault/keys.ts).
      # 32 bytes of "ci-only-vault-key-not-a-secret!!" in base64. Never
      # used outside this runner; production refuses a local key outright.
      VAULT_KEK: Y2ktb25seS12YXVsdC1rZXktbm90LWEtc2VjcmV0ISE=

    steps:
      # Full history. The diff moved to the `level` job above, but nothing
      # else under qa/ has been audited against a shallow clone and ten
      # seconds is cheaper than finding out on a Sunday.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      # From level 2, not just level 3. Two checks need a browser now -
      # the accessibility audit at level 3, and the end-to-end suite at
      # level 2 - so installing only at level 3 would leave the browser
      # suite with nothing to launch. Still not paid on the PR gate,
      # which is the point of the condition.
      # Only the shard that owns the browser checks pays for a browser.
      # `main` is the one with e2e and the accessibility audit in it; the
      # integration, utc and coverage shards never open one. At levels 1
      # and 2 the single "all" job owns everything, as before.
      - name: Install Chromium
        if: needs.level.outputs.value != '1' && (matrix.shard == 'all' || matrix.shard == 'main')
        run: npx playwright install --with-deps chromium

      # The demo fixtures the browser suite signs in as. Safe here and
      # nowhere else: this database is created empty by the service
      # container above and destroyed with the job, and every fixture is
      # prefixed "[DEMO]" so it is unmistakable if it ever turns up
      # somewhere it should not. The e2e check re-seeds immediately before
      # it runs as well, because the integration suite truncates.
      # Every shard, not just the one with the browser in it. The
      # integration suite truncates and seeds for itself, so in theory only
      # `main` needs this - but "in theory" is how a Sunday gets spent on a
      # red run, and the seed costs seconds. The browser install above is
      # conditional because it costs a minute and the other shards provably
      # never launch one.
      - name: Seed demo fixtures
        if: needs.level.outputs.value != '1'
        run: npm run db:seed

      # The step budget sits BELOW the job wall on purpose, so that an
      # overrun is a failure rather than a cancellation.
      #
      # What a job-wall cancellation actually does, checked against run
      # #406 rather than assumed: the `if: always()` steps below DO still
      # run (the partial artefact was uploaded), but `qa/run.mjs` is
      # killed before it prints a verdict or sets an exit code, so the
      # report has no PASS/FAIL line and the run is labelled "cancelled".
      # "Cancelled" reads as a person having stopped it, which is how two
      # Sundays in a row went unnoticed. A step that exceeds its own
      # budget fails, and a failed run is red, named and searchable.
      #
      # 75 leaves fifteen minutes under the wall: enough for the upload
      # and the teardown to finish on their own terms.
      - name: Run QA
        id: qa
        timeout-minutes: 75
        env:
          # Read-only, for the "Scheduled run health" check (see the
          # `actions: read` note above). Unauthenticated Actions API calls
          # are capped at 60 an hour per IP and runners share addresses,
          # so without this the check would go quiet exactly when the
          # runners are busy, which is when it matters.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node qa/run.mjs ${{ needs.level.outputs.value }} --shard=${{ matrix.shard }}

      # Always upload, especially on failure - the report is the artefact
      # worth reading, not the scrolled-past log.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-report-level-${{ needs.level.outputs.value }}-${{ matrix.shard }}
          path: qa/reports/
          retention-days: 30

      # Unsharded runs only. A shard's report is a quarter of a verdict and
      # must never reach the pull request on its own; the `report` job below
      # comments once the merge has a verdict to state.
      - name: Comment on the pull request
        if: always() && github.event_name == 'pull_request' && needs.level.outputs.sharded != 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = 'qa/reports/last.md';
            if (!fs.existsSync(path)) return;
            const body = fs.readFileSync(path, 'utf8');
            const marker = '<!-- ankora-qa -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const existing = (await github.rest.issues.listComments({ owner, repo, issue_number }))
              .data.find(c => c.body.includes(marker));
            const payload = `${marker}\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: payload });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: payload });
            }

  # One verdict out of the shards.
  #
  # Only a split run needs this: at levels 1 and 2 the single job already
  # wrote last.md and commented for itself, and nothing here would have
  # anything to merge.
  #
  # `if: always()` because this job matters most when a shard went red.
  # A merge that only ran on success would go quiet in exactly the case it
  # was written for.
  report:
    needs: [level, qa]
    if: always() && needs.level.outputs.sharded == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      # Every shard's report, whatever the shard called its artefact.
      # `merge-multiple` is off on purpose: each artefact keeps its own
      # directory, so two runs of the same shard cannot overwrite each
      # other and qa/merge.mjs can see both and keep the later one.
      - uses: actions/download-artifact@v8
        with:
          pattern: qa-report-level-*
          path: qa/shard-artifacts

      # Exits non-zero when a check blocked OR when a shard never reported.
      # A missing shard is a blocker by name: three green quarters and a
      # silence is not a pass, and "the run looked fine" is how two Sundays
      # went by unnoticed in October.
      - name: Merge the shard reports
        run: node qa/merge.mjs --level=${{ needs.level.outputs.value }} --dir=qa/shard-artifacts

      - name: Upload the merged report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-report-level-${{ needs.level.outputs.value }}
          path: qa/reports/
          retention-days: 30

      - name: Comment on the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = 'qa/reports/last.md';
            if (!fs.existsSync(path)) return;
            const body = fs.readFileSync(path, 'utf8');
            const marker = '<!-- ankora-qa -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const existing = (await github.rest.issues.listComments({ owner, repo, issue_number }))
              .data.find(c => c.body.includes(marker));
            const payload = `${marker}\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: payload });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: payload });
            }
